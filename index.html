<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Devoluções Avacy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--roxo:#7C3AED;--roxo-light:#A78BFA;--roxo-dark:#5B21B6;--amber:#F59E0B;--teal:#0D9488;--teal-light:#2DD4BF;--bg:#0F0D1A;--card:#1A1730;--card2:#221E38;--input:#2A2545;--line:#3D3660;--ink:#F8F7FF;--mute:#9B96C0;--dim:#6B6490;--ok:#10B981;--bad:#EF4444;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
header{background:linear-gradient(135deg,#1A1730 0%,#0F0D1A 100%);border-bottom:1px solid var(--line);padding:0 32px;min-height:64px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--roxo-light),var(--teal-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.env{background:var(--amber);color:#000;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.env:empty{display:none}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border:0;color:var(--mute);padding:8px 20px;border-radius:8px;cursor:pointer;font:500 14px 'Inter',sans-serif;transition:all .2s}
.tabs button:hover{background:var(--card2);color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,var(--roxo-dark),var(--roxo));color:#fff}
main{padding:28px 32px;max-width:1600px;margin:0 auto}
.banner{background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.45);color:var(--roxo-light);padding:10px 14px;border-radius:8px;margin-bottom:12px;display:none;cursor:pointer}
.banner.show{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:default}
.kpi .k{font-size:11px;color:var(--mute);text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--amber)}
.kpi.pend .v{color:var(--amber)}
.kpi.late .v{color:var(--bad)}.kpi.late.click:hover{border-color:var(--bad)}
.btn.ok{background:linear-gradient(135deg,#059669,#047857);border-color:transparent;color:#fff}.btn.ok:hover{filter:brightness(1.15)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--card);padding:16px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{font:14px 'Inter',sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--roxo-light);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
input[type=date]{color-scheme:dark}
select option{background:var(--card2)}
::placeholder{color:var(--dim)}
textarea{resize:vertical;min-height:70px}
.btn{font:600 13px 'Inter',sans-serif;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--mute);cursor:pointer;white-space:nowrap;transition:all .2s}
.btn:hover{border-color:var(--roxo-light);color:var(--ink)}
.btn.pri{background:linear-gradient(135deg,var(--roxo),var(--roxo-dark));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.15)}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(239,68,68,.4)}
.btn.danger:hover{background:rgba(239,68,68,.1)}
.btn.link{background:none;border:0;color:var(--roxo-light);padding:4px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spacer{flex:1}
.count{color:var(--mute);font-size:12px;margin:0 2px 8px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 330px)}
table{width:100%;border-collapse:collapse;min-width:1300px}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mute);padding:11px 12px;border-bottom:1px solid var(--line);background:var(--card2);letter-spacing:.05em;position:sticky;top:0;z-index:2;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{color:var(--roxo-light)}
td{padding:10px 12px;border-bottom:1px solid rgba(61,54,96,.5);vertical-align:top}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--card2)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.n{text-align:right}
.nw{white-space:nowrap}
.sub{color:var(--mute);font-size:12px;margin-top:2px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.clip2{max-width:260px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.miss{color:var(--amber);opacity:.8}
.empty{text-align:center;color:var(--mute);padding:40px!important;cursor:default}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-pendente{background:rgba(245,158,11,.12);color:#FCD34D;border-color:rgba(245,158,11,.45)}
.st-atrasada{background:rgba(239,68,68,.12);color:#FCA5A5;border-color:rgba(239,68,68,.45)}
.st-completo{background:rgba(16,185,129,.12);color:#6EE7B7;border-color:rgba(16,185,129,.4)}
.org{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.org-Martins{background:rgba(13,148,136,.15);color:var(--teal-light)}
.org-Avacy{background:rgba(124,58,237,.18);color:var(--roxo-light)}
.cp{border:0;background:none;cursor:pointer;color:var(--dim);font-size:12px;padding:2px 4px;border-radius:4px;transition:all .15s}
.cp:hover{color:var(--roxo-light);background:rgba(124,58,237,.1)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--card);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.5)}
.drawer.show{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--card2)}
.dh #dTitle{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.x{margin-left:auto;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mute);line-height:1}
.x:hover{color:var(--ink)}
.db{overflow:auto;padding:18px 20px;flex:1}
.df{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;background:var(--card2)}
h4{margin:18px 0 10px;font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.05em}
h4:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid2 .f input,.grid2 .f select,.grid2 .f textarea{width:100%}
.full{grid-column:1/-1}
.req > label::after{content:' *';color:var(--amber)}
.f.empty-req input,.f.empty-req select,.f.empty-req textarea{border-color:rgba(245,158,11,.55)}
.frete{display:flex;gap:8px;align-items:center}
.frete input[type=text]{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap;cursor:pointer}
.chk input{accent-color:var(--roxo)}
.ref{font-size:12px;color:var(--mute)}
.meta{font-size:12px;color:var(--dim);margin-top:16px}
/* modais */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(560px,100%);max-height:92vh;overflow:auto}
.box h3{margin:0 0 6px;font-size:18px}
.box .sub{margin-bottom:16px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;align-items:center}
.drop{display:block;width:100%;border:2px dashed var(--line);border-radius:12px;padding:30px 16px;text-align:center;color:var(--mute);cursor:pointer;transition:all .2s}
.drop:hover,.drop.over{border-color:var(--roxo-light);background:rgba(124,58,237,.08);color:var(--ink)}
.drop b{color:var(--roxo-light)}
.drop small{display:block;margin-top:6px;color:var(--dim);font-size:12px}
.res{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.res:empty{display:none}
.ri{display:flex;gap:10px;align-items:flex-start;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.ri .ic{font-weight:800;width:18px;text-align:center}
.ri.ok .ic{color:var(--ok)}.ri.bad .ic{color:var(--bad)}.ri.warn .ic{color:var(--amber)}
.ri .t{flex:1;min-width:0}
.ri .t div:first-child{font-weight:600}
.ri .btn{padding:5px 10px;font-size:12px}
.anexos{display:flex;flex-direction:column;gap:8px}
.anx{display:flex;align-items:center;gap:12px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.anx .ic{font-size:10px;font-weight:800;padding:6px 7px;border-radius:6px;background:rgba(124,58,237,.18);color:var(--roxo-light);border:1px solid rgba(124,58,237,.4);min-width:36px;text-align:center}
.anx .ic.pdf{background:rgba(239,68,68,.15);color:#FCA5A5;border-color:rgba(239,68,68,.35)}
.anx .ic.img{background:rgba(13,148,136,.15);color:var(--teal-light);border-color:rgba(13,148,136,.4)}
.anx.fila{border-style:dashed}
.anx-i{flex:1;min-width:0}
.anx-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anx .btn{padding:6px 10px;font-size:12px}
.anxadd{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:10px;z-index:80;display:none;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.ok{border-color:rgba(16,185,129,.5);color:var(--ok)}.toast.bad{border-color:rgba(239,68,68,.5);color:var(--bad)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.kpi .v{font-size:17px}header{padding:10px 16px}main{padding:16px}.grid2{grid-template-columns:1fr}.tablewrap{max-height:none}}
</style>
</head>
<body>
<header>
  <span class="brand">Devoluções</span>
  <span class="env" id="env"></span>
  <div class="tabs" id="tabs">
    <button data-tab="dev">Devoluções</button>
    <button data-tab="adi">Adicional</button>
    <button data-tab="des">Descontos</button>
    <button data-tab="col">Coleta</button>
  </div>
</header>

<main>
  <div class="banner" id="banner">Há atualizações feitas por outra pessoa. Clique para atualizar a lista.</div>

  <div class="kpis" id="kpis"></div>

  <div class="bar" id="bar">
    <div class="f" style="flex:1;min-width:220px"><label>Busca</label><input id="fBusca"></div>
    <div class="f"><label>Origem</label><select id="fOrigem"><option value="">Todas</option><option>Martins</option><option>Avacy</option></select></div>
    <div class="f"><label>Vendedor</label><select id="fVend"></select></div>
    <div class="f"><label>Status</label><select id="fStatus"></select></div>
    <div class="f" id="wMotivo"><label>Motivo</label><select id="fMotivo"></select></div>
    <div class="f" id="wTipo"><label>Tipo</label><select id="fTipo"><option value="">Todos</option><option>Desconto</option><option>NCC</option><option>NCC Manual</option><option>Abatimento</option><option>Ressarcimento</option></select></div>
    <div class="f" id="wTransp"><label>Transportadora</label><select id="fTransp"></select></div>
    <div class="f"><label id="lDe">De</label><input type="date" id="fDe"></div>
    <div class="f"><label>Até</label><input type="date" id="fAte"></div>
    <button class="btn" id="btnLimpar">Limpar</button>
    <div class="spacer"></div>
    <button class="btn" id="btnCsv" title="Baixa exatamente o que está filtrado na tela">⬇ Baixar CSV</button>
    <button class="btn pri" id="btnNovo">+ Novo</button>
  </div>

  <div class="count" id="count"></div>
  <div class="tablewrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div>
</main>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><div id="dTitle"></div><button class="x" id="dClose" title="Fechar">×</button></div>
  <div class="db" id="dBody"></div>
  <div class="df">
    <button class="btn danger" id="dDel">Excluir</button>
    <div class="spacer"></div>
    <button class="btn" id="dCancel">Fechar</button>
    <button class="btn" id="dReabrir" style="display:none">Reabrir coleta</button>
    <button class="btn ok" id="dConf" style="display:none">✔ Confirmar coleta</button>
    <button class="btn pri" id="dSave">Salvar</button>
  </div>
</aside>

<!-- Upload XML -->
<div class="modal" id="upModal">
  <div class="box">
    <h3 id="upTitle">Nova devolução</h3>
    <div class="sub">Envie o XML da nota fiscal. Os dados da nota são preenchidos sozinhos; o resto você completa em seguida.</div>
    <label class="drop" id="drop">
      <input type="file" id="xmlIn" accept=".xml,text/xml" multiple hidden>
      Arraste os XMLs aqui ou <b>clique para escolher</b><small>Pode enviar vários de uma vez</small>
    </label>
    <div class="res" id="upRes"></div>
    <div class="foot"><button class="btn link" id="upManual">Cadastrar sem XML</button><div class="spacer"></div><button class="btn" id="upClose">Fechar</button></div>
  </div>
</div>

<!-- Confirmação -->
<div class="modal" id="cfModal">
  <div class="box">
    <h3 id="cfTitle"></h3>
    <div class="sub" id="cfText"></div>
    <div class="foot"><button class="btn" id="cfNo">Voltar</button><button class="btn danger" id="cfYes">Excluir</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<datalist id="dlVend"></datalist>
<datalist id="dlTransp"></datalist>

<script>
// ============ CONFIGURAÇÃO ============
const CONFIG = {
  SUPABASE_URL: 'https://ufsoulckfkhtwurgyxlp.supabase.co',
  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmc291bGNrZmtodHd1cmd5eGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjczMTYsImV4cCI6MjA5Nzg0MzMxNn0.3JvUgfcllDgvs-THSADTjg15UYk5Bv8fA6GC5i9Cpg0',
  PREFIX: '',                // homologação: 'hml_'
  AMBIENTE: ''               // homologação: 'HOMOLOGAÇÃO'
};
// ======================================

const T = n => CONFIG.PREFIX + 'dev_' + n;
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dig = s => String(s ?? '').replace(/\D/g, '');
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

// ---------- formatação ----------
const brl = v => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const brNum = v => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const brDate = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '';
function parseNum(s){
  s = String(s ?? '').replace(/R\$|\s/g, '');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n*100)/100 : NaN;
}
function maskCnpj(v){
  const d = dig(v);
  if(d.length === 14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
  if(d.length === 11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
  return v || '';
}
const maskCep = v => { const d = dig(v); return d.length === 8 ? d.slice(0,5) + '-' + d.slice(5) : (v || ''); };
const copyBtn = v => v ? `<button class="cp" data-copy="${esc(v)}" title="Copiar">⧉</button>` : '';
const MISS = '<span class="miss">—</span>';
const freteTxt = (v, sem) => sem ? '<span class="sub">sem frete</span>' : (v == null ? MISS : brl(v));

// transportadora: nome curto padrão (igual ao histórico)
const TRANSP_CURTAS = ['BRASPRESS','JAMEF','FEDEX','PATRUS','RODONAVES','BUSLOG','TNT','JADLOG','CORREIOS'];
function transpCurta(n){
  const u = String(n || '').toUpperCase().trim();
  return TRANSP_CURTAS.find(t => u.includes(t)) || u || null;
}

// ---------- definição das frentes ----------
const TABS = {
  dev: {
    titulo: 'Devoluções', novo: '+ Nova devolução', tabela: 'devolucoes', dataKey: 'data_devolucao', lblData: 'Data devolução',
    busca: 'NF, NFD, cliente, CNPJ, pedido, ocorrência',
    buscaKeys: ['nf','nfd','cliente','cnpj','pedido','ocorrencia','vendedor'],
    cols: [
      {h:'Status', k:'status', v:r => badge(r)},
      {h:'Origem', k:'origem', v:r => `<span class="org org-${r.origem}">${esc(r.origem)}</span>${r.origem === 'Avacy' ? `<div class="sub">${esc(r.vendedor||'')}</div>` : ''}`},
      {h:'Transp.', k:'transportadora', v:r => esc(r.transportadora) || MISS},
      {h:'Cliente', k:'cliente', v:r => `<div class="clip2">${esc(r.cliente) || MISS}</div><div class="sub nw">${esc(maskCnpj(r.cnpj))}</div>`},
      {h:'NF', k:'nf', v:r => `<span class="mono nw">${esc(r.nf)}${copyBtn(r.nf)}</span>`},
      {h:'NFD', k:'nfd', v:r => r.nfd ? `<span class="mono nw">${esc(r.nfd)}${copyBtn(r.nfd)}</span>` : MISS},
      {h:'Vol', k:'volumes', n:1, v:r => r.volumes ?? MISS},
      {h:'UF', k:'uf', v:r => esc(r.uf) || MISS},
      {h:'Valor NFD', k:'valor_nfd', n:1, v:r => r.valor_nfd == null ? MISS : brl(r.valor_nfd)},
      {h:'Data dev.', k:'data_devolucao', v:r => r.data_devolucao ? `<span class="nw">${brDate(r.data_devolucao)}</span>` : MISS},
      {h:'Frete ida', k:'frete_ida', n:1, v:r => freteTxt(r.frete_ida, r.frete_ida_sem)},
      {h:'Frete rev.', k:'frete_reverso', n:1, v:r => freteTxt(r.frete_reverso, r.frete_reverso_sem)},
      {h:'Motivo', k:'motivo', v:r => esc(r.motivo) || MISS},
      {h:'Ocorrência', k:'ocorrencia', v:r => r.ocorrencia ? `<div class="clip2" title="${esc(r.ocorrencia)}">${esc(r.ocorrencia)}</div>` : MISS},
      {h:'Pedido', k:'pedido', v:r => r.pedido ? `<span class="mono nw">${esc(r.pedido)}${copyBtn(r.pedido)}</span>` : MISS},
    ],
    secoes: [
      ['Da nota fiscal', [
        {k:'origem', l:'Origem', t:'origem'}, {k:'vendedor', l:'Vendedor', t:'vend'},
        {k:'nf', l:'Nota fiscal', req:1}, {k:'transportadora', l:'Transportadora', req:1, t:'transp'},
        {k:'cliente', l:'Cliente (razão social)', req:1, full:1}, {k:'cnpj', l:'CNPJ', req:1, t:'cnpj'},
        {k:'uf', l:'UF', req:1, t:'uf'}, {k:'valor_nf', l:'Valor da NF', t:'num'}, {k:'cep', l:'CEP', t:'cep'},
      ]],

// ---------- status ----------
const PRAZO_COLETA = 7; // dias: coleta aberta há mais que isso = atrasada
const hojeISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0,10);
function diasAberta(r){ return r.data_abertura ? Math.max(0, Math.round((Date.parse(hojeISO()) - Date.parse(r.data_abertura)) / 86400000)) : 0; }
function stInfo(r){
  if(S.tab === 'col' || r.status === 'aberta' || r.status === 'coletada'){
    if(r.status === 'coletada') return {k:'coletada', l:'Coletada', cls:'completo', rank:2};
    const d = diasAberta(r);
    return d > PRAZO_COLETA ? {k:'atrasada', l:`Atrasada · ${d}d`, cls:'atrasada', rank:0} : {k:'aberta', l:'Aberta', cls:'pendente', rank:1};
  }
  return r.status === 'completo' ? {k:'completo', l:'Completo', cls:'completo', rank:1} : {k:'pendente', l:'Pendente', cls:'pendente', rank:0};
}
const badge = r => { const i = stInfo(r); return `<span class="st st-${i.cls}">${i.l}</span>`; };
const STATUS_OPTS = { col: [['aberta','Em aberto (inclui atrasadas)'],['atrasada','Atrasada'],['coletada','Coletada']], _: [['pendente','Pendente'],['completo','Completo']] };
function statusMatch(r, f){ const k = stInfo(r).k; return f === 'aberta' ? r.status === 'aberta' : k === f; }

// ---------- leitura do banco ----------
async function fetchAll(tab){
  const out = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from(T(TABS[tab].tabela)).select('*').order('created_at').range(from, from + 999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) break;
  }
  return out;
}
async function load(tab, force){
  if(S.data[tab] && !force) return;
  $('#rows').innerHTML = `<tr><td class="empty" colspan="20">Carregando…</td></tr>`;
  try { S.data[tab] = await fetchAll(tab); if(tab === 'des') await loadAnexos(); await loadXmls(tab); }
  catch(e){ console.error(e); $('#rows').innerHTML = `<tr><td class="empty" colspan="20">Não consegui ler o banco (${esc(e.message)}). Confira se o SQL foi rodado.</td></tr>`; throw e; }
}
async function loadMotivos(){
  const { data, error } = await sb.from(T('motivos')).select('*').order('ordem');
  if(!error) S.motivos = data;
  const r2 = await sb.from(T('motivos_desconto')).select('*').order('ordem');
  const r3 = await sb.from(T('motivos_coleta')).select('*').order('ordem');
  S.motivosCol = r3.error ? [] : r3.data;
  S.motivosDes = r2.error ? [{nome:'Falta', ativo:true, martins:true, avacy:true}, {nome:'Defeito', ativo:true, martins:true, avacy:true}] : r2.data;
}

// ---------- filtros ----------
const F = () => ({ busca: $('#fBusca').value.trim().toLowerCase(), origem: $('#fOrigem').value, vend: $('#fVend').value, status: $('#fStatus').value,
                   motivo: $('#fMotivo').value, tipo: $('#fTipo').value, transp: $('#fTransp').value, de: $('#fDe').value, ate: $('#fAte').value });
function filtered(){
  const cfg = TABS[S.tab], f = F(), rows = S.data[S.tab] || [];
  const bd = dig(f.busca);
  return rows.filter(r => {
    if(f.origem && r.origem !== f.origem) return false;
    if(f.vend && (r.vendedor || '') !== f.vend) return false;
    if(f.status && !statusMatch(r, f.status)) return false;
    if(f.motivo && S.tab !== 'adi' && (f.motivo === '__vazio' ? r.motivo : r.motivo !== f.motivo)) return false;
    if(f.tipo && S.tab === 'des' && r.tipo !== f.tipo) return false;
    if(f.transp && S.tab !== 'des' && (r[cfg.transpKey || 'transportadora'] || '') !== f.transp) return false;
    const d = r[cfg.dataKey];
    if(f.de && (!d || d < f.de)) return false;
    if(f.ate && (!d || d > f.ate)) return false;
    if(f.busca){
      const hit = cfg.buscaKeys.some(k => {
        const v = String(r[k] ?? '').toLowerCase();
        return v.includes(f.busca) || (bd.length >= 3 && dig(v).includes(bd) && /^\d[\d.\-\/\s]*$/.test(f.busca));
      });
      if(!hit) return false;
    }
    return true;
  });
}
function sorted(rows){
  const s = S.sort[S.tab];
  const cfg = TABS[S.tab];
  const out = rows.slice();
  if(!s){ // padrão: pendentes primeiro, depois data mais recente
    return out.sort((a, b) => stInfo(a).rank - stInfo(b).rank
      || String(b[cfg.dataKey] || '9999').localeCompare(String(a[cfg.dataKey] || '9999')) || String(b.created_at).localeCompare(String(a.created_at)));
  }
  const num = cfg.cols.find(c => c.k === s.k)?.n;
  return out.sort((a, b) => {
    let x = a[s.k], y = b[s.k];
    if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1;
    const c = num ? Number(x) - Number(y) : String(x).localeCompare(String(y), 'pt-BR', {numeric:true});
    return s.dir * c;
  });
}
function fillSelect(sel, values, all='Todos', keep=true){
  const cur = sel.value;
  sel.innerHTML = `<option value="">${all}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if(keep && values.includes(cur)) sel.value = cur;
}
function refreshFilterOptions(){
  const rows = S.data[S.tab] || [];
  const uniq = k => [...new Set(rows.map(r => r[k]).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'pt-BR'));
  fillSelect($('#fVend'), uniq('vendedor'));
  fillSelect($('#fTransp'), uniq(TABS[S.tab].transpKey || 'transportadora'), 'Todas');
  if(S.tab === 'dev'){
    fillSelect($('#fMotivo'), S.motivos.map(m => m.nome));
    $('#fMotivo').insertAdjacentHTML('beforeend', '<option value="__vazio">(sem motivo)</option>');
  } else if(S.tab === 'des') fillSelect($('#fMotivo'), (S.motivosDes || []).map(m => m.nome));
  else if(S.tab === 'col') fillSelect($('#fMotivo'), (S.motivosCol || []).map(m => m.nome));
  const allRows = Object.values(S.data).flat().filter(Boolean);
  $('#dlVend').innerHTML = [...new Set(allRows.map(r => r.vendedor).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('');
  $('#dlTransp').innerHTML = [...new Set(allRows.flatMap(r => [r.transportadora, r.transp_ida, r.transp_coleta]).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('');
}

  const cfg = TABS[S.tab];

  // KPIs
  const col = S.tab === 'col';

function fieldHTML(f, r){
  const v = r[f.k];
  const id = 'e_' + f.k;
  const val = esc(v ?? '');
  let input;
  switch(f.t){
    case 'origem': input = `<select id="${id}"><option ${v==='Martins'?'selected':''}>Martins</option><option ${v==='Avacy'?'selected':''}>Avacy</option></select>`; break;
    case 'vend': input = `<input id="${id}" value="${val}" list="dlVend">`; break;
    case 'transp': input = `<input id="${id}" value="${val}" list="dlTransp">`; break;
    case 'date': input = `<input type="date" id="${id}" value="${v ? v.slice(0,10) : ''}">`; break;
    case 'num': input = `<input type="text" inputmode="decimal" id="${id}" value="${v == null ? '' : brNum(v)}" placeholder="0,00">`; break;
    case 'int': input = `<input type="text" inputmode="numeric" id="${id}" value="${v ?? ''}">`; break;
    case 'cnpj': input = `<input id="${id}" value="${esc(maskCnpj(v))}" inputmode="numeric">`; break;
    case 'cep': input = `<input id="${id}" value="${esc(maskCep(v))}" inputmode="numeric">`; break;
    case 'uf': input = `<input id="${id}" value="${val}" maxlength="2" style="text-transform:uppercase">`; break;
    case 'area': input = `<textarea id="${id}">${val}</textarea>`; break;
    case 'frete': input = `<div class="frete"><input type="text" inputmode="decimal" id="${id}" value="${v == null ? '' : brNum(v)}" placeholder="0,00" ${r[f.sem] ? 'disabled' : ''}>
        <label class="chk"><input type="checkbox" id="e_${f.sem}" ${r[f.sem] ? 'checked' : ''}> Sem frete</label></div>`; break;
    case 'motivo': {
      const ops = S.motivos.filter(m => m.ativo || m.nome === v).map(m => m.nome);
      input = `<select id="${id}"><option value="">Escolha…</option>${ops.map(o => `<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`; break;
    }
    case 'sel': input = `<select id="${id}"><option value="">Escolha…</option>${f.opts.map(o => `<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`; break;
    case 'motivoCol': {
      const ops = (S.motivosCol || []).filter(m => m.ativo || m.nome === v).map(m => m.nome);
      input = `<select id="${id}"><option value="">Escolha…</option>${ops.map(o => `<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`; break;
    }
    case 'tipo': case 'motivoDes': input = `<select id="${id}"></select>`; break;
    default: input = `<input id="${id}" value="${val}">`;
  }
  let hint = '';
  if(f.hint === 'avacyParcial') hint = `<div class="ref" data-hint="${f.k}"></div>`;
  return `<div class="f ${f.full ? 'full' : ''} ${f.req ? 'req' : ''}" data-f="${f.k}">${f.l ? `<label for="${id}">${f.l}</label>` : ''}${input}${hint}</div>`;
}

function markEmpty(){

    const el = w.querySelector('input:not([type=checkbox]),select,textarea');
    const cb = w.querySelector('input[type=checkbox]');

  });
}
function closeDrawer(){ S.fila = []; S.xmlPend = null; $('#ov').classList.remove('show'); $('#drawer').classList.remove('show'); S.open = null; }
function readForm(){
  const cfg = TABS[S.tab], o = {};
  for(const [, fs] of cfg.secoes) for(const f of fs){
    const el = $('#e_' + f.k); if(!el) continue;
    let v = el.value.trim();
    switch(f.t){
      case 'num': case 'frete': { if(f.t === 'frete'){ o[f.sem] = $('#e_' + f.sem).checked; if(o[f.sem]){ o[f.k] = null; continue; } }
        const n = parseNum(v); if(Number.isNaN(n)) throw `Valor inválido em "${f.l}"`; o[f.k] = n; continue; }
      case 'int': o[f.k] = v === '' ? null : parseInt(dig(v), 10); continue;
      case 'cnpj': case 'cep': o[f.k] = dig(v) || null; continue;
      case 'uf': o[f.k] = v.toUpperCase() || null; continue;
      case 'transp': case 'vend': o[f.k] = v.toUpperCase() || null; continue;
      case 'date': o[f.k] = v || null; continue;
      default: o[f.k] = v || null;
    }
  }
  o.nf = dig(o.nf) || o.nf;
  if(!o.nf) throw 'Informe a nota fiscal.';
  if(o.nfd !== undefined) o.nfd = dig(o.nfd) || null;
  if(o.origem === 'Martins' && !o.vendedor) o.vendedor = 'MARTINS';
  return o;
}
async function save(){
  let o;
  try { o = readForm(); } catch(m){ toast(m, 'bad'); return; }
  const btn = $('#dSave'); btn.disabled = true;
  S.mute = Date.now() + 4000;
  try {
    let res;
    if(S.isNew) res = await sb.from(T(TABS[S.tab].tabela)).insert(o).select().single();
    else res = await sb.from(T(TABS[S.tab].tabela)).update(o).eq('id', S.open.id).select().single();
    if(res.error) throw res.error;
    upsertLocal(res.data);
    if(S.isNew && S.xmlPend){ await salvarXml(S.tab, res.data.id, S.xmlPend.file, S.xmlPend.x); S.xmlPend = null; }
    if(S.tab === 'des' && S.fila.length){ toast('Enviando anexos…'); await subirAnexos(res.data.id, S.fila); S.fila = []; }
    toast(res.data.status === 'completo' ? 'Salvo. Registro completo ✔' : res.data.status === 'coletada' ? 'Coleta confirmada ✔' : res.data.status === 'aberta' ? 'Salvo. Coleta em aberto.' : 'Salvo. Ainda há campos pendentes.', 'ok');
    closeDrawer(); refreshFilterOptions(); render();
  } catch(e){ toast(errMsg(e), 'bad'); }
  finally { btn.disabled = false; }
}
function upsertLocal(row, tab=S.tab){
  const arr = S.data[tab]; if(!arr) return;
  const i = arr.findIndex(x => x.id === row.id);
  if(i >= 0) arr[i] = row; else arr.push(row);
}
function errMsg(e){
  if(e?.code === '23505') return 'Já existe um registro com essa NF e essa NFD.';
  if(e?.code === '23514') return 'Combinação inválida (confira origem e tipo).';
  if(e?.code === '23503') return 'Motivo não cadastrado.';
  return 'Erro ao salvar: ' + (e?.message || e);
}
function askDelete(){

  $('#cfText').textContent = `NF ${r.nf}${r.nfd ? ' / NFD ' + r.nfd : ''} · ${r.cliente || ''}. Essa ação não pode ser desfeita.`;

async function doDelete(){

// ---------- anexos (descontos) ----------
const BUCKET = 'dev-anexos';
const PASTA = CONFIG.PREFIX ? 'hml' : 'prod';
const MAX_MB = 10;
const fmtSize = b => b < 1048576 ? Math.max(1, Math.round(b/1024)) + ' KB' : (b/1048576).toFixed(1).replace('.', ',') + ' MB';
const safeName = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.\-]+/g, '_').slice(-120);
const icone = (mime, nome) => /pdf/i.test(mime) || /\.pdf$/i.test(nome) ? ['PDF','pdf'] : /^image\//.test(mime) ? ['IMG','img'] : [(String(nome).split('.').pop() || 'ARQ').slice(0,4).toUpperCase(), ''];
async function loadAnexos(){
  const out = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from(T('desconto_anexos')).select('*').order('created_at').range(from, from + 999);
    if(error){ console.warn('anexos:', error.message); break; }
    out.push(...data); if(data.length < 1000) break;
  }
  S.anexos = {};
  out.forEach(a => (S.anexos[a.desconto_id] = S.anexos[a.desconto_id] || []).push(a));
}
function renderAnexos(){
  const box = $('#anxBox'); if(!box) return;
  const salvos = S.open && S.open.id ? (S.anexos[S.open.id] || []) : [];
  const item = (nome, mime, extra, btns, cls='') => { const [t, c] = icone(mime, nome);
    return `<div class="anx ${cls}"><span class="ic ${c}">${esc(t)}</span><div class="anx-i"><div class="anx-n" title="${esc(nome)}">${esc(nome)}</div><div class="sub">${extra}</div></div>${btns}</div>`; };
  box.innerHTML = (salvos.length || S.fila.length) ? `<div class="anexos">`
    + salvos.map(a => item(a.nome_arquivo, a.tipo_mime, `${fmtSize(a.tamanho || 0)} · ${new Date(a.created_at).toLocaleString('pt-BR')}`,
        `<button class="btn" data-dl="${a.id}" type="button">Baixar</button><button class="btn danger" data-rm="${a.id}" type="button">Remover</button>`)).join('')
    + S.fila.map((f, i) => item(f.name, f.type, `${fmtSize(f.size)} · será enviado ao salvar`, `<button class="btn" data-q="${i}" type="button">Tirar</button>`, 'fila')).join('')
    + `</div>` : `<div class="sub">Nenhum anexo.</div>`;
  box.onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.dl) baixarAnexo(b.dataset.dl);
    if(b.dataset.rm) askRemoverAnexo(b.dataset.rm);
    if(b.dataset.q != null){ S.fila.splice(+b.dataset.q, 1); renderAnexos(); }
  };
}
async function adicionarAnexos(files){
  const ok = files.filter(f => { if(f.size > MAX_MB * 1048576){ toast(`${f.name}: acima de ${MAX_MB} MB`, 'bad'); return false; } return true; });
  if(!ok.length) return;
  if(S.isNew || !S.open.id){ S.fila.push(...ok); renderAnexos(); return; }
  $('#anxBtn').disabled = true; toast('Enviando anexo…');
  const n = await subirAnexos(S.open.id, ok);
  $('#anxBtn').disabled = false;
  if(n) toast(`${n} arquivo(s) anexado(s).`, 'ok');
  renderAnexos(); render();
}
async function subirAnexos(id, files){
  let ok = 0;
  for(const f of files){
    const caminho = `${PASTA}/${id}/${Date.now()}_${safeName(f.name)}`;
    const up = await sb.storage.from(BUCKET).upload(caminho, f, { contentType: f.type || 'application/octet-stream', upsert: false });
    if(up.error){ toast(`${f.name}: não consegui enviar (${up.error.message})`, 'bad'); continue; }
    const r = await sb.from(T('desconto_anexos')).insert({ desconto_id: id, nome_arquivo: f.name, caminho, tamanho: f.size, tipo_mime: f.type || null }).select().single();
    if(r.error){ await sb.storage.from(BUCKET).remove([caminho]); toast(`${f.name}: ${r.error.message}`, 'bad'); continue; }
    (S.anexos[id] = S.anexos[id] || []).push(r.data); ok++;
  }
  return ok;
}
function acharAnexo(aid){ for(const k in S.anexos){ const a = S.anexos[k].find(x => x.id === aid); if(a) return a; } }
async function baixarAnexo(aid){
  const a = acharAnexo(aid); if(!a) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(a.caminho, 60, { download: a.nome_arquivo });
  if(error){ toast('Não consegui baixar: ' + error.message, 'bad'); return; }
  const l = document.createElement('a'); l.href = data.signedUrl; l.target = '_blank'; l.rel = 'noopener';
  document.body.appendChild(l); l.click(); l.remove();
}
function askRemoverAnexo(aid){
  const a = acharAnexo(aid); if(!a) return;
  $('#cfTitle').textContent = 'Remover anexo?';
  $('#cfText').textContent = `${a.nome_arquivo}. O arquivo será apagado e não poderá ser recuperado.`;
  $('#cfYes').textContent = 'Remover';
  S.cfAction = async () => {
    $('#cfModal').classList.remove('show');
    await sb.storage.from(BUCKET).remove([a.caminho]);
    const { error } = await sb.from(T('desconto_anexos')).delete().eq('id', a.id);
    if(error){ toast('Erro ao remover: ' + error.message, 'bad'); return; }
    S.anexos[a.desconto_id] = (S.anexos[a.desconto_id] || []).filter(x => x.id !== a.id);
    renderAnexos(); render(); toast('Anexo removido.', 'ok');
  };
  $('#cfModal').classList.add('show');
}

async function salvarXml(tab, id, file, x){

function xmlLinha(r){

  document.body.appendChild(l); l.click(); l.remove();

// ---------- XML da NF-e ----------
function parseNFe(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw 'Arquivo não é um XML válido.';
  const inf = doc.getElementsByTagNameNS('*', 'infNFe')[0];
  if(!inf) throw 'Não encontrei uma NF-e neste XML.';
  const one = (p, tag) => p ? p.getElementsByTagNameNS('*', tag)[0] : null;
  const tx = (p, tag) => { const e = one(p, tag); return e ? e.textContent.trim() : null; };
  const ide = one(inf, 'ide'), dest = one(inf, 'dest'), ender = one(dest, 'enderDest'), tot = one(inf, 'ICMSTot'), transp = one(inf, 'transp');
  const vols = transp ? [...transp.getElementsByTagNameNS('*', 'vol')] : [];
  const qVol = vols.reduce((a, v) => a + (parseInt(tx(v, 'qVol')) || 0), 0) || null;
  const cpl = tx(inf, 'infCpl') || '';
  // forma de pagamento: o texto "Forma Pagto:" das observações é o confiável (o código tPag do ERP vem sempre 01)
  const fpTxt = ((cpl.match(/Forma\s*Pagto\s*:\s*([^,;\n]+)/i) || [])[1] || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const tPag = tx(inf, 'tPag');
  const formaPag = /BOLETO/.test(fpTxt) ? 'BOLETO' : /PIX/.test(fpTxt) ? 'PIX' : /CART/.test(fpTxt) && /CRED/.test(fpTxt) ? 'CARTÃO DE CRÉDITO'
    : ({'15':'BOLETO','17':'PIX','03':'CARTÃO DE CRÉDITO'})[tPag] || null;
  const vendedor = (cpl.match(/Vendedor:\s*([^,;\n]+)/i) || [])[1]?.trim().toUpperCase() || null;
  const pedidoMts = (cpl.match(/Pedido\s*\(MTS\)\s*:\s*([^\s,;]+)/i) || [])[1] || null;
  const pedidoAvacy = (cpl.match(/Pedido\s*:\s*([^\s,;]+)/i) || [])[1] || null;
  const vNF = tx(tot, 'vNF');
  return {
    nf: String(parseInt(tx(ide, 'nNF'), 10)), emissao: (tx(ide, 'dhEmi') || '').slice(0,10),
    cliente: tx(dest, 'xNome'), cnpj: tx(dest, 'CNPJ') || tx(dest, 'CPF'),
    uf: tx(ender, 'UF'), cep: tx(ender, 'CEP'), vNF: vNF ? Number(vNF) : null,
    transp: tx(one(transp, 'transporta'), 'xNome'), qVol,
    vendedor, origem: vendedor === 'MARTINS' ? 'Martins' : 'Avacy', pedidoMts, pedidoAvacy,
    chave: (inf.getAttribute('Id') || '').replace(/^NFe/, '') || null, formaPag,
    emit: tx(one(inf, 'emit'), 'xNome'),
  };
}
function openUpload(){ $('#upRes').innerHTML = ''; $('#xmlIn').value = ''; $('#upModal').classList.add('show'); }
async function handleFiles(files){
  const cfg = TABS[S.tab], tbl = T(cfg.tabela);
  for(const file of files){
    const item = document.createElement('div');
    item.className = 'ri'; item.innerHTML = `<span class="ic">…</span><div class="t"><div>${esc(file.name)}</div><div class="sub">Lendo…</div></div>`;
    $('#upRes').prepend(item);
    const set = (kind, title, sub, row) => {
      item.className = 'ri ' + kind;
      item.innerHTML = `<span class="ic">${kind === 'ok' ? '✔' : kind === 'warn' ? '!' : '✖'}</span><div class="t"><div>${title}</div><div class="sub">${sub}</div></div>`
        + (row ? `<button class="btn">Completar</button>` : '');
      if(row) item.querySelector('button').onclick = () => { $('#upModal').classList.remove('show'); openDrawer(row); };
    };
    try {
      const x = parseNFe(await file.text());
      const nome = `NF ${esc(x.nf)} · ${esc(x.cliente || '')}`;
      const quem = x.origem === 'Martins' ? 'Martins' : `Avacy · ${esc(x.vendedor || 'vendedor não identificado')}`;
      // já existe?
      const existentes = (S.data[S.tab] || []).filter(r => r.nf === x.nf);
      if(S.tab === 'dev' && x.origem === 'Martins' && existentes.length){
        set('warn', nome, `Essa NF já está cadastrada (Martins é sempre devolução total).`, existentes[0]); continue;
      }
      if(S.tab === 'dev' && existentes.some(r => !r.nfd)){
        set('warn', nome, `Já existe uma devolução desta NF sem NFD. Complete a NFD dela antes de lançar outra.`, existentes.find(r => !r.nfd)); continue;
      }
      if(S.tab === 'col'){
        const ab = existentes.find(r => r.status === 'aberta');
        if(ab){ set('warn', nome, `Já existe uma coleta em aberto para essa NF. Nada foi criado.`, ab); continue; }
      } else if(S.tab !== 'dev' && existentes.length){
        set('warn', nome, `Já existe ${existentes.length > 1 ? existentes.length + ' registros' : 'um registro'} com essa NF nesta aba. Nada foi criado.`, existentes[0]); continue;
      }
      const o = cfg.doXml(x);
      if(S.tab === 'des' && x.origem === 'Avacy'){ // Avacy: backoffice escolhe NCC, Abatimento ou Ressarcimento antes de gravar
        const novo = Object.fromEntries(Object.entries(o).filter(([k]) => COLS_DB.des.includes(k)));
        set('warn', nome, `${quem}. Escolha o tipo (NCC, NCC Manual, Abatimento ou Ressarcimento) e salve.`);
        item.insertAdjacentHTML('beforeend', '<button class="btn">Preencher</button>');
        item.querySelector('button').onclick = () => { $('#upModal').classList.remove('show'); S.xmlPend = {file, x}; openDrawer(novo, true); };
        if(files.length === 1){ $('#upModal').classList.remove('show'); S.xmlPend = {file, x}; openDrawer(novo, true); }
        continue;
      }
      const clean = Object.fromEntries(Object.entries(o).filter(([k]) => COLS_DB[S.tab].includes(k)));
      S.mute = Date.now() + 4000;
      const { data, error } = await sb.from(tbl).insert(clean).select().single();
      if(error) throw errMsg(error);
      upsertLocal(data);
      await salvarXml(S.tab, data.id, file, x);
      const falta = x.origem === 'Avacy' && S.tab === 'dev' ? 'Avacy: informe valor e volumes que voltaram.' : 'Complete os campos manuais.';
      set('ok', nome, `${quem} · ${esc(x.transp || '')} · ${brl(x.vNF)}. ${falta}`, data);
      if(files.length === 1){ $('#upModal').classList.remove('show'); openDrawer(data); toast('Dados da nota preenchidos. Complete o restante.', 'ok'); }
    } catch(e){ set('bad', esc(file.name), esc(typeof e === 'string' ? e : (e.message || e))); }
  }
  refreshFilterOptions(); render();
}
function novoManual(){
  $('#upModal').classList.remove('show');
  const r = S.tab === 'des' ? { origem:'Martins', vendedor:'MARTINS', tipo:'Desconto' } : { origem:'Martins', vendedor:'MARTINS' };
  openDrawer(r, true);
}

// ---------- CSV ----------
function baixarCsv(){
  const cfg = TABS[S.tab];
  const rows = sorted(filtered());
  if(!rows.length){ toast('Nada para baixar com esses filtros.', 'bad'); return; }
  const cols = cfg.csv.concat(cfg.csvExtra ? cfg.csvExtra(rows) : []);
  const cell = v => { v = v == null ? '' : String(v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [cols.map(c => c[0]).join(';')].concat(rows.map(r => cols.map(c => cell(c[1](r))).join(';')));
  const f = F();
  const per = f.de || f.ate ? `_${(f.de || 'inicio')}_a_${(f.ate || 'hoje')}` : '';
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${cfg.titulo.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')}${f.origem ? '_' + f.origem.toLowerCase() : ''}${per}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${rows.length} registros baixados.`, 'ok');
}

// ---------- tempo real (aviso silencioso) ----------
function realtime(){
  const ch = sb.channel('dev-' + CONFIG.PREFIX);
  ['dev','adi','des','col'].forEach(tab => ch.on('postgres_changes', {event:'*', schema:'public', table: T(TABS[tab].tabela)}, () => {
    if(Date.now() < S.mute) return;
    S.stale = S.stale || new Set(); S.stale.add(tab);
    if(tab === S.tab) $('#banner').classList.add('show');
    else S.data[tab] = null; // recarrega quando abrir a aba
  }));
  ch.subscribe();
}

// ---------- eventos ----------
$('#tabs').onclick = e => { const b = e.target.closest('button'); if(b) showTab(b.dataset.tab); };
['#fBusca'].forEach(id => $(id).oninput = render);
['#fOrigem','#fVend','#fStatus','#fMotivo','#fTipo','#fTransp','#fDe','#fAte'].forEach(id => $(id).onchange = render);
$('#btnLimpar').onclick = () => { $$('#bar input, #bar select').forEach(el => el.value = ''); S.sort[S.tab] = null; render(); };
$('#thead').onclick = e => {
  const th = e.target.closest('th'); if(!th) return;
  const k = th.dataset.k, s = S.sort[S.tab];
  S.sort[S.tab] = !s || s.k !== k ? {k, dir: 1} : s.dir === 1 ? {k, dir: -1} : null;
  render();
};
$('#rows').onclick = e => {
  const cp = e.target.closest('.cp');
  if(cp){ e.stopPropagation(); navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast('Copiado: ' + cp.dataset.copy, 'ok')); return; }
  const tr = e.target.closest('tr[data-id]'); if(!tr) return;
  const r = S.data[S.tab].find(x => x.id === tr.dataset.id); if(r) openDrawer(r);
};
$('#btnNovo').onclick = openUpload;
$('#upClose').onclick = () => $('#upModal').classList.remove('show');
$('#upManual').onclick = novoManual;
$('#xmlIn').onchange = e => handleFiles([...e.target.files]);
const drop = $('#drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handleFiles([...e.dataTransfer.files].filter(f => /\.xml$/i.test(f.name))); };
$('#dClose').onclick = closeDrawer; $('#dCancel').onclick = closeDrawer; $('#ov').onclick = closeDrawer;
$('#dSave').onclick = save;
$('#dConf').onclick = () => {
  const falta = $$('#dBody .f.req').filter(w => !String(w.querySelector('input,select,textarea').value).trim()).map(w => w.querySelector('label').textContent);
  if(falta.length){ markEmpty(); toast('Para confirmar a coleta, preencha: ' + falta.join(', '), 'bad'); return; }
  if(!$('#e_data_coleta').value) $('#e_data_coleta').value = hojeISO();
  save();
};
$('#dReabrir').onclick = () => { $('#e_data_coleta').value = ''; save(); }; $('#dDel').onclick = askDelete;
$('#cfNo').onclick = () => $('#cfModal').classList.remove('show'); $('#cfYes').onclick = () => S.cfAction && S.cfAction();
$('#btnCsv').onclick = baixarCsv;
$('#banner').onclick = async () => { $('#banner').classList.remove('show'); await load(S.tab, true); refreshFilterOptions(); render(); };
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if($('#cfModal').classList.contains('show')) $('#cfModal').classList.remove('show'); else if($('#upModal').classList.contains('show')) $('#upModal').classList.remove('show'); else closeDrawer(); }
  if(e.key === 's' && (e.ctrlKey || e.metaKey) && S.open){ e.preventDefault(); save(); }
});

// ---------- início ----------
$('#env').textContent = CONFIG.AMBIENTE;
document.title = (CONFIG.AMBIENTE ? '[HML] ' : '') + 'Devoluções Avacy';
(async () => {
  await loadMotivos();
  await showTab(S.tab);
  realtime();
})();
</script>
